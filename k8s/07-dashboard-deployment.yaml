---
# ═══════════════════════════════════════════════════════════
# Deployment: Dashboard Web (Nginx con Frontend Estático)
# ═══════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  namespace: default
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: cavalocal-dashboard:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
# ═══════════════════════════════════════════════════════════
# Service: Dashboard Web (ClusterIP)
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
