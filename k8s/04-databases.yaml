# PostgreSQL — Backend Principal (cavalocal)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-backend-deployment
  namespace: default
  labels:
    app: postgres-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-backend
  template:
    metadata:
      labels:
        app: postgres-backend
    spec:
      containers:
        - name: postgres-backend
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_DB_BACKEND
          volumeMounts:
            - name: postgres-backend-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-backend-data
          persistentVolumeClaim:
            claimName: postgres-backend-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-backend-service
  namespace: default
  labels:
    app: postgres-backend
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-backend
---
