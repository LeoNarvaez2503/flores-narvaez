---
# ═══════════════════════════════════════════════════════════
# Deployment: PostgreSQL — Backend Principal (cavalocal)
# ═══════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-backend-deployment
  namespace: default
  labels:
    app: postgres-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-backend
  template:
    metadata:
      labels:
        app: postgres-backend
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: postgres-backend-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-backend-data
          persistentVolumeClaim:
            claimName: postgres-backend-pvc
---
# Service: PostgreSQL Backend
apiVersion: v1
kind: Service
metadata:
  name: postgres-backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: postgres-backend
  ports:
    - port: 5432
      targetPort: 5432
---
# ═══════════════════════════════════════════════════════════
# Deployment: PostgreSQL — Microservicio de Auditoría (audit_db)
# ═══════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-audit-deployment
  namespace: default
  labels:
    app: postgres-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-audit
  template:
    metadata:
      labels:
        app: postgres-audit
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cavalocal-secrets
                  key: POSTGRES_AUDIT_DB
          volumeMounts:
            - name: postgres-audit-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-audit-data
          persistentVolumeClaim:
            claimName: postgres-audit-pvc
---
# Service: PostgreSQL Audit
apiVersion: v1
kind: Service
metadata:
  name: postgres-audit-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: postgres-audit
  ports:
    - port: 5432
      targetPort: 5432
