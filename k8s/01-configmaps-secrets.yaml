---
# ═══════════════════════════════════════════════════════════
# Secret: Credenciales sensibles (Base64)
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: cavalocal-secrets
  namespace: default
type: Opaque
data:
  # echo -n 'postgres' | base64
  POSTGRES_USER: cG9zdGdyZXM=
  # echo -n 'postgrespassword' | base64
  POSTGRES_PASSWORD: cG9zdGdyZXNwYXNzd29yZA==
  # echo -n 'cavalocal' | base64
  POSTGRES_DB: Y2F2YWxvY2Fs
  # echo -n 'audit_db' | base64
  POSTGRES_AUDIT_DB: YXVkaXRfZGI=
  # echo -n 'guest' | base64
  RABBITMQ_DEFAULT_USER: Z3Vlc3Q=
  # echo -n 'guest' | base64
  RABBITMQ_DEFAULT_PASS: Z3Vlc3Q=
  # echo -n 'clave-secreta-desarrollo-cavalocal' | base64
  JWT_SECRET: Y2xhdmUtc2VjcmV0YS1kZXNhcnJvbGxvLWNhdmFsb2NhbA==
---
# ═══════════════════════════════════════════════════════════
# ConfigMap: Variables de configuración no sensibles
# ═══════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: cavalocal-config
  namespace: default
data:
  # URLs de conexión usando DNS interno de Kubernetes
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres-backend-service.default.svc.cluster.local:5432/cavalocal?schema=public"
  AUDIT_DATABASE_URL: "postgresql://postgres:postgrespassword@postgres-audit-service.default.svc.cluster.local:5432/audit_db?schema=public"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service.default.svc.cluster.local:5672"
  RABBITMQ_HOST: "rabbitmq-service.default.svc.cluster.local"
  DATABASE_HOST: "postgres-backend-service.default.svc.cluster.local"
  CORS_ORIGINS: "*"
  JWT_EXPIRES_IN: "7d"
  NODE_ENV: "production"
