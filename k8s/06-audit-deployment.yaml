apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-deployment
  namespace: default
  labels:
    app: audit-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: cavalocal-audit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: DATABASE_URL_AUDIT
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: cavalocal-config
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: default
  labels:
    app: audit-service
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      name: http
  selector:
    app: audit-service
