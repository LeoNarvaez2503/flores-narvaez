---
# ═══════════════════════════════════════════════════════════
# Ingress: Enrutamiento HTTP para conjunta3p.espe.edu.ec
# NGINX Ingress Controller con soporte SSE
# ═══════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cavalocal-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Soporte para Server-Sent Events (SSE) — timeouts largos, sin buffering
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: conjunta3p.espe.edu.ec
      http:
        paths:
          # Ruta para la API REST y SSE del Microservicio de Auditoría
          - path: /api/audit(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: audit-service
                port:
                  number: 3002

          # Ruta para el Dashboard SSE Web
          - path: /dashboard(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dashboard-service
                port:
                  number: 80

          # Ruta para el Backend Principal CavaLocal
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
